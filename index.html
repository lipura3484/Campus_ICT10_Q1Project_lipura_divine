<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT10 Project Dashboard</title>

    <style>
      body {
    
    background-image: url('SAKAY NA.jpg');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: #f0f0f0;
}


        header {
            background-color: #c07610;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .dashboard {
            text-align: center;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .dashboard h2 {
            color: #ffffff;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .card {
            background-color: #f3f3c0;
            width: 250px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        .card h3 {
            color: #e99621;
        }

        .card p {
            color: #555;
        }

        .card a {
            display: inline-block;
            background-color: #e99621;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <header>
        <h1>ICT PROJECT 1Q</h1>
        <h1>Sari-Sari Store Management</h1>
    </header>
       

    <div class="dashboard">

        <h2>MABUHAY! BABA NA AT BUMILI 
            NA SA SARI-SARI STORE NI ALING DIVINE!</h2>

        <div class="cards">

            <div class="card">
                <h3>SKU </h3>
                <a href="sku.html">Open SKU Generator</a>
            </div>

            <div class="card">
                <h3>Receipt</h3>
                

                <a href="receipt.html">Open Receipt Generator</a>
            </div>

        </div>

    </div>

  

</body>

</html>
