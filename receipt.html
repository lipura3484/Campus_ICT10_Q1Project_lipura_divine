<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receipt Generator</title>

    <style>
        body {
    
    background-image: url('Sari-Sari Store Poster.jpg');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: #f0f0f0;
}


        .container {
            background-color: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        h1 {
            text-align: center;
            color: #e99621;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #e99621;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #fcef7d;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #e99621;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #e99621;
        }

        .receipt {
            margin-top: 25px;
            padding: 20px;
            border: 2px solid #e99621;
            border-radius: 10px;
            background-color: #f3f3c0;
        }

        .receipt h2 {
            text-align: center;
            color: #efbd3e;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            color: #efbd3e;
        }

        a {
            color: #e99621;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
 
    <div class="container">

        <h1>Divine's sari-sari</h1>

        <label>Customer Name</label>
        <input type="text" id="customer">

        <label>Product Name</label>
        <input type="text" id="product">

        <label>Quantity</label>
        <input type="number" id="quantity">

        <label>Price</label>
        <input type="number" id="price">

        <button onclick="generateReceipt()">
            Generate Receipt
        </button>

        <div class="receipt">

            <h2>Receipt</h2>

            <p id="customerOutput">Customer: </p>
            <p id="productOutput">Product: </p>
            <p id="quantityOutput">Quantity: </p>
            <p id="priceOutput">Price: </p>

            <p class="total" id="totalOutput">
                Total: ₱0
            </p>

        </div>

        <p>
            <a href="index.html">Back to Dashboard</a>
        </p>

        <p>
            <a href="sku.html">SKU Generator</a>
        </p>

    </div>

    <script>

        function generateReceipt() {

            let customer =
                document.getElementById("customer").value;

            let product =
                document.getElementById("product").value;

            let quantity =
                Number(document.getElementById("quantity").value);

            let price =
                Number(document.getElementById("price").value);

            let total = quantity * price;

            document.getElementById("customerOutput").innerHTML =
                "Customer: " + customer;

            document.getElementById("productOutput").innerHTML =
                "Product: " + product;

            document.getElementById("quantityOutput").innerHTML =
                "Quantity: " + quantity;

            document.getElementById("priceOutput").innerHTML =
                "Price: ₱" + price;

            document.getElementById("totalOutput").innerHTML =
                "Total: ₱" + total;
        }

    </script>

</body>

</html>
